# 配置名称: Surge自用
# 配置作者: JupiterH
# 更新时间: 2026-11-05
# 配合module使用：https://github.com/JupiterH/Surge/blob/main/Module/DNS.sgmodule, https://github.com/JupiterH/Surge/blob/main/Module/General.sgmodule

[General]
# 日志级别
loglevel = notify

# 请求失败时显示 Surge 内置错误页
show-error-page = true

# 优先处理 UDP 数据包（游戏模式）
udp-priority = true

# 普通 HTTP 请求命中 REJECT 策略时显示错误页
show-error-page-for-reject = true

# Wi-Fi 网络状况不佳时，使用蜂窝数据建立连接
wifi-assist = true

# 让不含点号的简单主机名由 VIF 接管，而不是由系统代理接管
exclude-simple-hostnames = true

# 所有 TCP 连接和 DNS 查询始终同时使用 Wi-Fi 与蜂窝网络
all-hybrid = false

# 启用完整 IPv6 支持
ipv6 = true
ipv6-vif = auto

# Surge iOS 工作模式
compatibility-mode = 3

# 代理策略连通性测试超时时间（秒）
test-timeout = 3

# 延迟测试
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://latency-test.skk.moe/endpoint
proxy-test-udp = www.apple.com@64.6.64.6

# GeoIP 数据库更新地址
geoip-maxmind-url = https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb

# 是否禁用 GeoIP 数据库自动更新
disable-geoip-db-auto-update = false

# 上游传统 DNS 服务器
dns-server = 223.5.5.5, 114.114.114.114, system

# 是否跳过加密 DNS 服务器证书校验（跳过会降低安全性）
encrypted-dns-skip-cert-verification = false

# 加密 DNS 请求是否遵循出站模式设置与规则（关闭时默认直连）
encrypted-dns-follow-outbound-mode = false

# 劫持53端口的DNS查询
hijack-dns = *:53

# 读取 /etc/hosts 中的本地 DNS 映射
read-etc-hosts = true

# 允许局域网内其他设备访问 Surge 代理服务
allow-wifi-access = true

# Surge HTTP 代理服务端口（局域网共享）
wifi-access-http-port = 6152
http-listen = 0.0.0.0

# Surge SOCKS5 代理服务端口（局域网共享）
wifi-access-socks5-port = 6153
socks5-listen = 0.0.0.0

# 远程控制（external-controller-access / http-api）含访问密码，不放在公开配置里。
# 需要时在本机 Surge 里单独添加，例如：
#   external-controller-access = 你的密码@0.0.0.0:6170
#   http-api = 你的密码@0.0.0.0:6171
#   http-api-web-dashboard = true
#   http-api-tls = true




# 隐藏系统状态栏中的 VPN 图标
hide-vpn-icon = false

# 让 Surge VIF 接管所有网络请求
include-all-networks = false
# 须同时启用include-all-networks
# 让 Surge VIF 接管发往局域网的请求
include-local-networks = false
# 让 Surge VIF 接管 Apple 推送通知服务（APNs）流量
include-apns = false
# 让 Surge VIF 接管可经互联网路由的蜂窝服务流量
include-cellular-services = false

# UDP 流量命中不支持 UDP 转发的策略时回退到 REJECT
udp-policy-not-supported-behaviour = REJECT

# 使用代理策略时，若目标域名有本地 DNS 映射，则使用映射后的 IP 建立代理连接
use-local-host-item-for-proxy = false

# Wi-Fi 不是主网络接口时，SSID/BSSID 子网表达式仍参与匹配
subnet-exp-wifi-always-match = false

[Proxy]
🇨🇳 𝘿𝙄𝙍𝙀𝘾𝙏 = direct
🚫 𝙍𝙀𝙅𝙀𝘾𝙏 = reject
🇭🇰 𝙃𝙆 = snell, 你的服务器IP, 13792, psk=你的PSK, version=6, mode=default, reuse=true, tfo=true
🇺🇸 𝙐𝙎 = snell, 你的服务器IP, 13792, psk=你的PSK, version=6, mode=default, reuse=true, tfo=true

