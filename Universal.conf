# 配置名称: Surge 通用配置
# 配置作者: JupiterH
# 更新时间: 2026-11-11
# 适用版本: Surge Mac 5.8+ / Surge iOS 5.12+（smart 策略组、include-other-group）
#
# 使用方法：
#   1. 把 [Proxy Group] 里「📦 订阅」的 policy-path 换成你的机场订阅链接（只需改这一处）
#   2. 推荐同时安装以下模块（Surge → 模块 → 安装新模块）：
#      https://cdn.jsdelivr.net/gh/JupiterH/Surge@main/Module/General.sgmodule   通用 skip-proxy / always-real-ip
#      https://cdn.jsdelivr.net/gh/JupiterH/Surge@main/Module/DNS.sgmodule       国内厂商域名走各自的 DNS
#      https://ruleset.skk.moe/Modules/google_cn_307.sgmodule                     google.cn 重定向到 google.com（需开启 MITM）
#   3. 分流规则来自 https://github.com/SukkaW/Surge ，顺序按其 README：
#      所有 DOMAIN-SET / non_ip 规则都放在 ip 规则之前，避免对需要代理的域名提前发起 DNS 解析

[General]
# 日志级别
loglevel = notify

# 请求失败时显示 Surge 内置错误页
show-error-page = true

# 普通 HTTP 请求命中 REJECT 策略时显示错误页
show-error-page-for-reject = true

# 优先处理 UDP 数据包（游戏模式）
udp-priority = true

# Wi-Fi 网络状况不佳时，使用蜂窝数据建立连接
wifi-assist = true

# 让不含点号的简单主机名由 VIF 接管，而不是由系统代理接管
exclude-simple-hostnames = true

# 启用完整 IPv6 支持（家里有 IPv6 且确认节点支持时再打开）
ipv6 = false
ipv6-vif = auto

# Surge iOS 工作模式
compatibility-mode = 3

# 代理策略连通性测试超时时间（秒）
test-timeout = 3

# 延迟测试
internet-test-url = http://wifi.vivo.com.cn/generate_204
proxy-test-url = http://latency-test.skk.moe/endpoint
proxy-test-udp = www.apple.com@64.6.64.6

# GeoIP 数据库（中国大陆 IP 优化版）
geoip-maxmind-url = https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb
disable-geoip-db-auto-update = false

# 上游传统 DNS 服务器
dns-server = 223.5.5.5, 119.29.29.29, system

# 加密 DNS 请求是否遵循出站模式设置与规则（关闭时默认直连）
encrypted-dns-follow-outbound-mode = false

# 劫持 53 端口的 DNS 查询
hijack-dns = *:53

# 读取 /etc/hosts 中的本地 DNS 映射
read-etc-hosts = true

# 允许局域网内其他设备访问 Surge 代理服务（需要共享给其他设备时改为 true）
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153

# 远程控制（含访问密码，按需自行添加）：
#   external-controller-access = 你的密码@127.0.0.1:6170
#   http-api = 你的密码@127.0.0.1:6171

# 让 Surge VIF 接管所有网络请求
include-all-networks = false
include-local-networks = false
include-apns = false
include-cellular-services = false

# UDP 流量命中不支持 UDP 转发的策略时回退到 REJECT
udp-policy-not-supported-behaviour = REJECT

[Proxy]
# 自建节点写在这里，例如：
# 🇭🇰 自建 = snell, 服务器IP, 端口, psk=密码, version=5, reuse=true, tfo=true

[Proxy Group]
# 功能分组
🚀 节点选择 = select, ♻️ 自动选择, 🇭🇰 香港, 🇨🇳 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, DIRECT, icon-url=SF::paperplane
🤖 AI = select, 🇺🇸 美国, 🇯🇵 日本, 🇸🇬 新加坡, 🇨🇳 台湾, 🚀 节点选择, icon-url=SF::sparkles
📺 流媒体 = select, 🚀 节点选择, 🇭🇰 香港, 🇨🇳 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, DIRECT, icon-url=SF::play.tv
✈️ Telegram = select, 🚀 节点选择, 🇭🇰 香港, 🇸🇬 新加坡, 🇯🇵 日本, 🇺🇸 美国, icon-url=SF::paperplane.fill
🍎 Apple = select, DIRECT, 🚀 节点选择, 🇭🇰 香港, 🇺🇸 美国, icon-url=SF::apple.logo
Ⓜ️ 微软 = select, DIRECT, 🚀 节点选择, 🇭🇰 香港, 🇺🇸 美国, icon-url=SF::pc
🅰️ Adobe = select, DIRECT, 🚀 节点选择, REJECT, icon-url=SF::wand.and.rays
💳 PayPal = select, 🇺🇸 美国, 🚀 节点选择, DIRECT, icon-url=SF::creditcard
⬇️ 下载 = select, 🚀 节点选择, DIRECT, 🇭🇰 香港, icon-url=SF::arrow.down.circle
🌐 国外网站 = select, 🚀 节点选择, 🇭🇰 香港, 🇨🇳 台湾, 🇯🇵 日本, 🇸🇬 新加坡, 🇺🇸 美国, icon-url=SF::globe
🐟 漏网之鱼 = select, 🚀 节点选择, DIRECT, icon-url=SF::fish

# 节点分组：只需修改「📦 订阅」的 policy-path，其余分组从它筛选
📦 订阅 = select, policy-path=替换为你的订阅链接, update-interval=86400, hidden=1
♻️ 自动选择 = smart, include-other-group=📦 订阅, icon-url=SF::bolt
🇭🇰 香港 = smart, include-other-group=📦 订阅, policy-regex-filter=(🇭🇰|港|Hong|HK), icon-url=SF::h.square
🇨🇳 台湾 = smart, include-other-group=📦 订阅, policy-regex-filter=(🇹🇼|台|Taiwan|TW), icon-url=SF::t.square
🇯🇵 日本 = smart, include-other-group=📦 订阅, policy-regex-filter=(🇯🇵|日本|Japan|JP), icon-url=SF::j.square
🇸🇬 新加坡 = smart, include-other-group=📦 订阅, policy-regex-filter=(🇸🇬|新加坡|狮城|Singapore|SG), icon-url=SF::s.square
🇺🇸 美国 = smart, include-other-group=📦 订阅, policy-regex-filter=(🇺🇸|美国|States|US), icon-url=SF::u.square

[Rule]
# ===== Non IP（不触发 DNS 解析）=====
# 自定义规则写在这里，优先级最高，例如：
# DOMAIN-SUFFIX,example.com,DIRECT

# 广告 / 隐私 / 恶意软件 / 钓鱼拦截
RULE-SET,https://cdn.jsdelivr.net/gh/JupiterH/Surge@main/Rule/Reject.list,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/sogouinput.conf,REJECT-DROP,pre-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP,pre-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT,extended-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_extra.conf,REJECT,extended-matching
# 钓鱼域名约 13 万条，Surge Mac 上无性能问题；iOS 内存紧张时可注释掉
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject_phishing.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT-NO-DROP,extended-matching
# 需直连的服务（热点认证、PT 站、下载工具等），放在拦截之后，避免其中的广告域名被提前放行
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT,extended-matching
# 测速
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/speedtest.conf,🚀 节点选择,extended-matching
# 静态 CDN
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/cdn.conf,🚀 节点选择,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,🚀 节点选择,extended-matching
# 流媒体
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,📺 流媒体,extended-matching
# AI（Apple Intelligence 必须在 Apple 规则之前）
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,🤖 AI,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_intelligence.conf,🤖 AI,extended-matching
# Telegram
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,✈️ Telegram,extended-matching
# Apple
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/apple_cdn.conf,🍎 Apple,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,🍎 Apple,extended-matching
# Microsoft
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,Ⓜ️ 微软,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft.conf,Ⓜ️ 微软,extended-matching
# Adobe / PayPal
RULE-SET,https://cdn.jsdelivr.net/gh/JupiterH/Surge@main/Rule/adobe.list,🅰️ Adobe,extended-matching
RULE-SET,https://cdn.jsdelivr.net/gh/JupiterH/Surge@main/Rule/paypal.list,💳 PayPal,extended-matching
# 软件更新、系统镜像等大文件下载（放在 Apple / Microsoft 之后，让它们的国内 CDN 先直连）
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/download.conf,⬇️ 下载,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/download.conf,⬇️ 下载,extended-matching
# 局域网 / 国内 / 国外常见服务
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,🌐 国外网站,extended-matching

# ===== IP（从这里开始会触发 DNS 解析）=====
RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT-DROP
RULE-SET,https://ruleset.skk.moe/List/ip/stream.conf,📺 流媒体
RULE-SET,https://ruleset.skk.moe/List/ip/ai.conf,🤖 AI
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,✈️ Telegram
# Telegram 客户端连向上述 IP 以外的地址时直接丢弃，与 Sukka 的做法一致（仅 Mac 生效）
PROCESS-NAME,Telegram,REJECT-DROP
RULE-SET,https://ruleset.skk.moe/List/ip/lan.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/cdn.conf,🚀 节点选择
RULE-SET,https://ruleset.skk.moe/List/ip/download.conf,⬇️ 下载
RULE-SET,https://ruleset.skk.moe/List/ip/apple_services.conf,🍎 Apple
RULE-SET,https://ruleset.skk.moe/List/ip/domestic.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip_ipv6.conf,DIRECT

# 兜底：DNS 解析失败时也直接走代理
FINAL,🐟 漏网之鱼,dns-failed

[MITM]
# 在 Surge → MITM 中生成并安装、信任证书后，模块里的 MITM 功能才会生效
h2 = true
tcp-connection = true
